<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lake Watch Magazine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a dark reading room with a 3D flipbook in the middle; paper pages alternate light and dark, charts are tappable. */
:root{
  --panel:#0F2021; --panel2:#162728; --control:#193536;
  --mint:#75C6A8; --mintbright:#9BE0C3; --gold:#F3D48A;
  --water:#3B8B9A; --land:#597A56; --mist:#DCE3E4;
  --good:#3FBF6B; --amber:#F2B134; --poor:#E5484D;
  --paper:#F3F8F6; --teal-ink:#2A6670;
  --display:'Bricolage Grotesque',system-ui,sans-serif;
  --body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(1200px 600px at 50% -10%,#1d3b3d 0%,var(--panel) 60%);color:var(--mist);font-family:var(--body);overflow-x:hidden}
a{color:inherit}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.top{max-width:1100px;margin:0 auto;padding:14px 16px;display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between}
.brand{font-family:var(--display);font-weight:800;font-size:20px;color:#fff;display:flex;align-items:center;gap:10px}
.top .meta{font-family:var(--mono);font-size:12.5px;color:#9CC4BF}
.top a.back{font-size:14px;color:var(--mintbright);text-decoration:none;min-height:44px;display:inline-flex;align-items:center}

.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
.stage{position:relative;width:100%}
.scaler{position:absolute;left:50%;top:0;transform-origin:top center;perspective:2400px}
.book{position:relative;width:100%;height:100%;transition:transform .9s cubic-bezier(.4,.1,.2,1)}
.leaf{position:absolute;top:0;transform-origin:left center;transform-style:preserve-3d;transition:transform .95s cubic-bezier(.45,.05,.25,1)}
.leaf.flipped{transform:rotateY(-180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;box-shadow:0 20px 40px rgba(0,0,0,.35)}
.face.front{border-radius:3px 10px 10px 3px}
.face.back{transform:rotateY(180deg);border-radius:10px 3px 3px 10px}
.face.front::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.28),rgba(0,0,0,0) 9%)}
.face.back::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(270deg,rgba(0,0,0,.28),rgba(0,0,0,0) 9%)}
.face.blank{background:var(--panel2)}

.controls{max-width:760px;margin:18px auto 0;display:flex;align-items:center;gap:14px;padding:0 16px}
.cbtn{width:48px;height:48px;border-radius:50%;border:2px solid var(--mint);background:transparent;color:var(--mintbright);font-size:22px;flex:none;display:grid;place-items:center}
.cbtn:hover:not(:disabled){background:var(--mint);color:var(--panel)}
.cbtn:disabled{opacity:.35;cursor:default}
.slidebox{flex:1;display:flex;flex-direction:column;gap:6px}
.slidebox label{font-family:var(--mono);font-size:12.5px;color:#9CC4BF;text-align:center}
input[type=range]{width:100%;accent-color:var(--mint);height:28px}
.hint{text-align:center;font-size:13px;color:#7FA6A2;margin:10px 0 40px}

/* pages */
.page{width:100%;height:100%;padding:34px 32px 58px;display:flex;flex-direction:column;gap:12px;overflow-y:auto;scrollbar-width:thin;font-size:14.5px;line-height:1.55}
.light{background:var(--paper);color:var(--panel)}
.dark{background:var(--panel2);color:#E4F0EE}
.kicker{font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;margin:0}
.light .kicker{color:var(--teal-ink)} .dark .kicker{color:var(--mintbright)}
.page h2{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.05;letter-spacing:-.015em;margin:0;text-wrap:balance}
.dark h2{color:#fff}
.page p{margin:0}
.src{font-size:12px;opacity:.75;margin-top:auto}
.folio{position:absolute;left:0;right:0;bottom:0;padding:18px 18px 10px;display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:11px;letter-spacing:.12em;opacity:.9;z-index:2}
.light .folio{background:linear-gradient(180deg,rgba(243,248,246,0),#F3F8F6 40%)}.dark .folio{background:linear-gradient(180deg,rgba(22,39,40,0),#162728 40%)}.folio button{min-width:44px;height:36px;border-radius:18px;border:1.5px solid currentColor;background:transparent;color:inherit;font-size:16px}
.folio button:hover{background:var(--mint);color:var(--panel);border-color:var(--mint)}
.folio .sp{min-width:44px}

.chip{font-family:var(--body);font-size:13.5px;font-weight:700;min-height:40px;padding:6px 14px;border-radius:10px;border:1.5px solid currentColor;background:transparent;color:inherit}
.light .chip{color:var(--teal-ink)} .dark .chip{color:var(--mintbright)}
.chip.on,.chip:hover{background:var(--mint);color:var(--panel);border-color:var(--mint)}
.row{display:flex;flex-wrap:wrap;gap:8px}
.card{border-radius:14px;padding:11px 15px}
.light .card{background:#fff;border:1px solid #D4E3DF} .dark .card{background:var(--control);border:1px solid #2C5254}
.card b{display:block;font-family:var(--display);font-size:17px;margin-bottom:3px}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:#fff;border:1px solid #D4E3DF;border-radius:14px;padding:12px 14px}
.stat .n{font-family:var(--display);font-weight:800;font-size:34px;line-height:1;color:var(--teal-ink)}
.stat .u{font-size:13px;opacity:.8;margin-top:4px}

.barrow{display:grid;grid-template-columns:96px 1fr 52px;gap:10px;align-items:center;width:100%;text-align:left;background:transparent;border:1.5px solid transparent;color:inherit;border-radius:10px;padding:3px 6px;min-height:40px;font-size:13px}
.barrow:hover,.barrow.on{border-color:var(--mint)}
.bar{height:16px;border-radius:8px;overflow:hidden;position:relative}
.light .bar{background:#DCE8E4} .dark .bar{background:#0F2021}
.bar i{display:block;height:100%;width:0;border-radius:8px;background:var(--water);transition:width 1s cubic-bezier(.3,.7,.2,1)}
.seen .bar i{width:var(--w)}
.val{font-family:var(--mono);font-weight:700;text-align:right}
.chart{position:relative}
.gline{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed var(--gold);pointer-events:none}
.gline span{position:absolute;top:-16px;transform:translateX(-50%);font-family:var(--mono);font-size:11px;color:var(--gold);white-space:nowrap}

.acc{display:flex;flex-direction:column;gap:8px}
.accb{width:100%;text-align:left;border-radius:12px;padding:10px 14px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14.5px;min-height:44px;border:1px solid #D4E3DF;background:#fff;color:var(--panel)}
.dark .accb{background:var(--control);border-color:#2C5254;color:#E4F0EE}
.accb::after{content:"+";font-family:var(--mono);font-size:18px;color:var(--teal-ink)}
.dark .accb::after{color:var(--mintbright)}
.accb[aria-expanded=true]{border-color:var(--mint)}
.accb[aria-expanded=true]::after{content:"–"}
.accp{display:none;padding:2px 14px 10px;font-size:14px}
.accp.open{display:block}

.q{margin-bottom:6px}
.q .qt{font-weight:700;margin-bottom:6px;font-size:14.5px}
.opts{display:flex;flex-wrap:wrap;gap:6px}.opt{flex:1 1 auto;text-align:center;min-height:40px;padding:6px 12px;border-radius:10px;border:1.5px solid #B9D0D0;background:#fff;color:var(--panel);font-size:14px}
.opt:hover:not(:disabled){border-color:var(--mint)}
.opt.ok{background:#D6F3E3;border-color:var(--good)} .opt.no{background:#FBDADB;border-color:var(--poor)}
.qe{font-size:13px;color:var(--teal-ink);min-height:0}

.check{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:transparent;border:0;color:inherit;padding:5px 0;font-size:14px;min-height:42px}
.box{width:22px;height:22px;border-radius:6px;border:2px solid var(--mint);flex:none;display:grid;place-items:center;font-weight:800;color:var(--panel);margin-top:1px}
.check.done .box{background:var(--mint)}
.check.done .box::after{content:"✓"}

.tl{display:flex;gap:8px;flex-wrap:wrap}
.gauge{display:flex;gap:18px;align-items:flex-end}
.tank{position:relative;width:96px;height:210px;border:2px solid #4C7A7C;border-radius:8px 8px 14px 14px;overflow:hidden;background:#0F2021;flex:none}
.water{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,#8FD6EC,#2E93C9);transition:height .6s cubic-bezier(.3,.7,.2,1)}
.mark{position:absolute;left:0;right:0;height:0;border-top:2px dashed}
.mark span{position:absolute;right:4px;top:-17px;font-family:var(--mono);font-size:10.5px;background:rgba(15,32,33,.8);padding:0 3px}
.bigv{font-family:var(--display);font-weight:800;font-size:46px;line-height:1;color:var(--gold)}

.srcs{margin:0;padding-left:18px;font-size:12.5px;line-height:1.5}
.srcs li{margin-bottom:5px}
.srcs a{color:var(--teal-ink);word-break:break-word}

.flow{width:100%;height:auto;display:block;border-radius:12px;background:#0F2021}
.flow .fwd{display:block} .flow .bwd{display:none}
.flow.bf .fwd{display:none} .flow.bf .bwd{display:block}
@keyframes dash{to{stroke-dashoffset:-24}}
.flow .anim{animation:dash 1.2s linear infinite}

.cover{background:linear-gradient(180deg,#0B1A1B 0%,#10393F 55%,#0F2021 100%);color:#fff;position:relative}
.cover .inner{position:absolute;inset:0;padding:34px 32px;display:flex;flex-direction:column}
.mast{font-family:var(--display);font-weight:800;font-size:86px;line-height:.86;letter-spacing:-.04em;margin:6px 0 0}
.mast span{color:var(--mint)}
.cl{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px;font-weight:700;font-size:15px}
.cl li{display:flex;gap:10px}
.cl li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--gold);margin-top:7px;flex:none}
.cbtn2{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:10px 22px;border-radius:12px;background:var(--mint);color:var(--panel);font-weight:700;font-size:15px;border:0;text-decoration:none}
.cbtn2.ghost{background:transparent;color:var(--mintbright);border:2px solid var(--mint)}

@media (prefers-reduced-motion:reduce){.leaf,.book,.bar i,.water{transition:none}.flow .anim{animation:none}}

/* Wall-display mode: the magazine becomes a focused, edge-to-edge reader inside the simulator. */
body.embedded{background:radial-gradient(1000px 520px at 50% -12%,#1d4a4c 0%,#071617 66%);overflow:hidden}
body.embedded .top,body.embedded .controls,body.embedded .hint{display:none}
body.embedded .wrap{width:100%;max-width:none;padding:0}
body.embedded .stage{height:100dvh;min-height:0;touch-action:none}
body.embedded .scaler{top:0}
body.embedded .page{font-size:clamp(12px,1.35vw,14.5px)}
body.embedded .folio{padding-bottom:12px}
body.embedded .folio button{display:none}
body.embedded .folio{justify-content:center}
</style>
</head>

var W=440,H=720,TOTAL=16;

 ],

 ],

  {t:'Forest and soil: about 2%',x:'Soil erosion from cleared hillsides adds silt and nutrients. Over time it also makes the lake shallower.'}
 ],
 par:[

 ]

 {d:'Aug 14, 1 p.m.',v:12.23,x:'Climbing toward the critical mark after persistent rain. It was 12.17 m at 7 a.m. LLDA urged low-lying shore communities to clear drainage and creeks.'},
 {d:'Aug 29',v:12.58,x:'Above the 12.50 m critical high mark. LLDA told shoreline residents to stay vigilant and watch for official announcements.'},

 {q:'At what water level does LLDA call it critical high?',o:['10.50 m','11.50 m','12.50 m'],a:2,e:'12.50 m is the critical high mark. 10.50 m is the critical low.'},

];

/* ---------- helpers ---------- */
function folio(n,dark){
  var p=n>0?'<button type="button" data-go="'+(n-1)+'" aria-label="Previous page">‹</button>':'<span class="sp"></span>';
  var nx=n<TOTAL-1?'<button type="button" data-go="'+(n+1)+'" aria-label="Next page">›</button>':'<span class="sp"></span>';

function page(n,cls,html){return '<section class="page '+cls+'" data-n="'+n+'">'+html+folio(n)+'</section>';}
function prepareExternalLinks(){if(!embedded)return;document.querySelectorAll('a[href^="http"]').forEach(function(link){link.target='_blank';link.rel='noopener noreferrer';});}
function bars(g,rows,max,extra){

}
function acc(items,g){
  return '<div class="acc" data-accg="'+g+'">'+items.map(function(it,i){return '<div><button type="button" class="accb" aria-expanded="false" data-acc="'+g+i+'">'+it[0]+'</button><div class="accp" id="'+g+i+'">'+it[1]+'</div></div>';}).join('')+'</div>';

/* ---------- build + flip engine ---------- */
function build(){
  book.innerHTML='';leaves=[];
  var F=faces(),dbl=mode==='double';
  N=dbl?TOTAL/2:TOTAL;
  var bw=dbl?2*W:W;
  scaler.style.width=bw+'px';scaler.style.overflow=dbl?'visible':'hidden';scaler.style.height=H+'px';
  for(var i=0;i<N;i++){
    var leaf=document.createElement('div');leaf.className='leaf';
    leaf.style.width=W+'px';leaf.style.height=H+'px';leaf.style.left=(dbl?W:0)+'px';
    var fr=dbl?F[2*i]:F[i],bk=dbl?F[2*i+1]:'';
    leaf.innerHTML='<div class="face front">'+fr+'</div><div class="face back'+(bk?'':' blank')+'">'+bk+'</div>';
    book.appendChild(leaf);leaves.push(leaf);
  }
  jump.max=(mode==='single'?N-1:N);
  k=dbl?Math.ceil(curFace/2):curFace;
  leaves.forEach(function(l,i){if(i<k)l.classList.add('flipped');});
  finalZ();shift();vis(true);init();prepareExternalLinks();
}
function finalZ(){leaves.forEach(function(l,i){l.style.zIndex=i<k?i+1:N-i;});}
function shift(){
  if(mode==='double'){book.style.transform='translateX('+(k===0?-W/2:(k===N?W/2:0))+'px)';}
  else book.style.transform='none';
  prevB.disabled=k===0;nextB.disabled=k===N||(mode==='single'&&k===N-1);
  jump.value=k;
  var lab;
  if(mode==='double'){lab=k===0?'Cover':(k===N?'Back cover':'Pages '+(2*k)+' – '+(2*k+1)+' of '+TOTAL);}
  else lab='Page '+(k+1)+' of '+TOTAL;
  pgl.textContent=lab;
}
function visible(){
  var v=[];
  if(mode==='double'){if(k>0)v.push(2*k-1);if(k<N)v.push(2*k);}else v.push(Math.min(k,TOTAL-1));
  return v;
}
function vis(now){
  var v=visible();
  book.querySelectorAll('.page').forEach(function(p){var n=+p.dataset.n;var on=v.indexOf(n)>-1;p.inert=!on;if(on&&now)p.classList.add('seen');});
  setTimeout(function(){book.querySelectorAll('.page').forEach(function(p){var n=+p.dataset.n;if(visible().indexOf(n)>-1){p.classList.add('seen');runCounts(p);}});},now?50:700);
  curFace=v.length?(mode==='double'?(k===0?0:v[0]):v[0]):0;
  try{history.replaceState(null,'','#p'+(curFace+1));}catch(e){}
}
function setK(nk){
  nk=Math.max(0,Math.min(mode==='single'?N-1:N,nk));
  if(nk===k)return;
  var old=k,fwd=nk>old,idx=[],i;
  if(fwd){for(i=old;i<nk;i++)idx.push(i);}else{for(i=old-1;i>=nk;i--)idx.push(i);}
  k=nk;shift();vis(false);notifyParent();
  var step=reduce?0:Math.min(130,1000/idx.length);
  idx.forEach(function(li,j){setTimeout(function(){var l=leaves[li];l.style.zIndex=100;l.classList.toggle('flipped',fwd);setTimeout(finalZ,reduce?0:1000);},j*step);});
}
function go(face){setK(mode==='double'?Math.ceil(face/2):face);}
function notifyParent(){if(!embedded||window.parent===window)return;window.parent.postMessage({source:'lakewatch-magazine',type:'state',page:curFace,total:TOTAL,atStart:k===0,atEnd:k===N},'*');}
window.addEventListener('message',function(e){if(!embedded||e.data?.source!=='lakewatch-wall'||e.data.type!=='navigate')return;if(e.data.direction==='prev')setK(k-1);else if(e.data.direction==='next')setK(k+1);else notifyParent();});

/* ---------- interactions ---------- */
function runCounts(scope){
  scope.querySelectorAll('.count').forEach(function(el){
    var to=parseFloat(el.dataset.to),dec=+el.dataset.dec||0,pre=el.dataset.pre||'',comma=el.dataset.comma;
    function fmt(v){var s=v.toFixed(dec);if(comma)s=Number(s).toLocaleString('en-US');return pre+s;}
    if(reduce){el.textContent=fmt(to);return;}
    var t0=performance.now();(function f(t){var p=Math.min(1,(t-t0)/900),e=1-Math.pow(1-p,3);el.textContent=fmt(to*e);if(p<1)requestAnimationFrame(f);})(t0);
  });
}

    document.getElementById('qe'+qi).textContent=q.e;
    document.getElementById('score').textContent=score;
    if(Object.keys(answered).length===QUIZ.length){document.getElementById('scoret').textContent=score===QUIZ.length?'Perfect. You know the lake.':score>=2?'Good work. Flip back to review the rest.':'Flip back through the issue and try again.';}
  }
});
prevB.addEventListener('click',function(){setK(k-1);});
nextB.addEventListener('click',function(){setK(k+1);});
jump.addEventListener('input',function(){setK(+jump.value);});
document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT'&&e.target.type==='range')return;
  if(e.key==='ArrowRight')setK(k+1);else if(e.key==='ArrowLeft')setK(k-1);
  else if(e.key==='Home')setK(0);else if(e.key==='End')setK(N);
});
var sx=null,sy=null;
stage.addEventListener('pointerdown',function(e){if(e.target.closest('button,input,a,.accb'))return;sx=e.clientX;sy=e.clientY;});
stage.addEventListener('pointerup',function(e){
  if(sx===null)return;var dx=e.clientX-sx,dy=e.clientY-sy;sx=null;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){setK(dx<0?k+1:k-1);}
});

/* ---------- layout ---------- */
function layout(){
  var wide=window.innerWidth>=900,m=wide?'double':'single';
  var avail=stage.parentElement.clientWidth,bw=wide?2*W:W;
  var s=Math.min(1,avail/bw);
  var sh=(window.innerHeight-(embedded?16:190))/H;
  s=Math.min(s,Math.max(.5,sh));
  scaler.style.transform='translateX(-50%) scale('+s+')';
  if(embedded){stage.style.height=window.innerHeight+'px';scaler.style.top=Math.max(0,(window.innerHeight-H*s)/2)+'px';}else{stage.style.height=(H*s+8)+'px';scaler.style.top='0px';}
  if(m!==mode){mode=m;build();}
}
var rt;window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(layout,120);});

var h=location.hash.match(/^#p(\d+)$/);
if(h){curFace=Math.max(0,Math.min(TOTAL-1,+h[1]-1));}
layout();
if(embedded&&window.parent!==window)window.parent.postMessage({source:'lakewatch-magazine',type:'ready'},'*');
})();
</script>
